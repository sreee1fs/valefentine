<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Филюши ❤️</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe6e6;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            z-index: 10;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
        }

        .cat-container img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        button {
            padding: 15px 25px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: #ff4d6d;
            color: white;
            z-index: 100;
        }

        #noBtn {
            background-color: #adb5bd;
            color: white;
        }

        .date {
            margin-top: 20px;
            color: #ff85a2;
            font-weight: bold;
        }

        /* Скрытый плеер для музыки */
        #music-player {
            position: absolute;
            width: 0;
            height: 0;
            border: none;
        }
    </style>
</head>
<body>

    <iframe id="music-player" 
        src="https://www.youtube.com/embed/xOgdaVoSuWg?autoplay=1&loop=1&playlist=xOgdaVoSuWg" 
        allow="autoplay">
    </iframe>

    <div class="container" id="mainContent">
        <div class="cat-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/K1TQa8WWvAVP2/giphy.gif" alt="Котик">
        </div>
        <h1>Филюша, ты будешь моей валентинкой? ❤️</h1>
        <div class="date">14.02.2026</div>
        
        <div class="buttons">
            <button id="yesBtn">Да</button>
            <button id="noBtn">Нет</button>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const h1 = document.querySelector('h1');
        
        let yesSize = 1.2;
        let clickCount = 0;

        const phrases = [
            "Ты уверена?",
            "Подумай еще раз...",
            "Ну пожалуйста :(",
            "Я буду плакать...",
            "ФИЛЮШААА!",
            "Жми ДА!"
        ];

        noBtn.addEventListener('click', () => {
            clickCount++;
            
            // Увеличиваем кнопку "Да"
            yesSize += 0.5;
            yesBtn.style.transform = `scale(${yesSize})`;
            
            // Меняем текст на кнопке "Да"
            if (clickCount < phrases.length) {
                yesBtn.innerText = phrases[clickCount - 1];
            } else {
                yesBtn.innerText = "БЕЗ ВАРИАНТОВ!";
            }

            // Если кнопка "Да" стала слишком большой, она перекрывает всё
            if (yesSize > 10) {
                noBtn.style.display = 'none';
            }
        });

        yesBtn.addEventListener('click', () => {
            document.body.innerHTML = `
                <div style="text-align:center;">
                    <h1 style="color: #d63384; font-size: 3rem;">УРААА! ❤️❤️❤️</h1>
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExNHJueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueGZueCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/MDJ9IbxxvDUQM/giphy.gif" width="300">
                    <p style="font-size: 1.5rem; color: #ff4d6d;">Самый лучший день 14.02.2026!</p>
                </div>
                <iframe style="display:none" src="https://www.youtube.com/embed/xOgdaVoSuWg?autoplay=1"></iframe>
            `;
            createHearts();
        });

        function createHearts() {
            for (let i = 0; i < 50; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '❤️';
                heart.style.position = 'absolute';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.top = '-20px';
                heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                heart.style.animation = `fall ${Math.random() * 3 + 2}s linear forwards`;
                document.body.appendChild(heart);
            }
        }

        // Стиль для анимации сердечек
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fall {
                to { transform: translateY(110vh); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
