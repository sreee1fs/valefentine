<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Для Филюши ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    .card {
      background: white;
      padding: 36px;
      border-radius: 26px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      text-align: center;
      max-width: 440px;
      animation: fadeIn 2s ease;
      z-index: 2;
    }
    h1 {
      color: #e63946;
      margin-bottom: 6px;
      font-size: 2.2rem;
    }
    .date {
      color: #999;
      margin-bottom: 14px;
      font-size: 0.95rem;
    }
    p {
      color: #555;
      font-size: 1.1rem;
      line-height: 1.55;
    }
    .buttons {
      margin-top: 28px;
      display: flex;
      gap: 16px;
      justify-content: center;
      position: relative;
    }
    button {
      padding: 14px 26px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease;
      position: relative;
      z-index: 1;
    }
    #yesBtn {
      background: #e63946;
      color: white;
    }
    #noBtn {
      background: #ddd;
      color: #555;
    }
    #yesBtn:hover {
      background: #d62828;
    }
    .float span {
      position: absolute;
      font-size: 24px;
      animation: floatUp 8s linear infinite;
      opacity: 0.9;
      pointer-events: none;
    }
    @keyframes floatUp {
      0% { transform: translateY(110vh) scale(0.6); opacity: 0; }
      10% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }
    iframe {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Музыка -->
  <iframe src="https://www.youtube.com/embed/xOgdaVoSuWg?autoplay=1&loop=1&playlist=xOgdaVoSuWg" allow="autoplay"></iframe>

  <div class="float"></div>

  <div class="card">
    <h1>Для Филюши ❤️</h1>
    <div class="date">14.02.2026</div>
    <p>
      Филюша, ты самый тёплый человек в моей жизни.
      Я хочу, чтобы этот день был про нас, про улыбки,
      котят и любовь, которая становится только сильнее.
    </p>

    <div class="buttons">
      <button id="yesBtn">Ты будешь моей валентинкой? 💌</button>
      <button id="noBtn">Нет</button>
    </div>
  </div>

  <script>
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');
    let scale = 1;
    let texts = [
      'Ты уверен? 🥺',
      'А если котята? 🐱',
      'Я очень старался 💔',
      'Ну пожалуйста 🥹',
      'Выбора нееет, становись ❤️'
    ];
    let textIndex = 0;

    noBtn.addEventListener('click', () => {
      scale += 0.25;
      yesBtn.style.transform = `scale(${scale})`;
      yesBtn.textContent = texts[textIndex % texts.length];
      textIndex++;

      if (scale > 3.5) {
        noBtn.style.display = 'none';
        yesBtn.textContent = 'Ты всё равно моя валентинка ❤️';
      }
    });

    yesBtn.addEventListener('click', () => {
      document.body.innerHTML = '<h1 style="color:white;text-align:center">Я тебя люблю, Филюша ❤️🐱</h1>';
    });

    const floatContainer = document.querySelector('.float');
    function createItem() {
      const span = document.createElement('span');
      span.textContent = Math.random() > 0.5 ? '🐱' : '❤️';
      span.style.left = Math.random() * 100 + 'vw';
      span.style.fontSize = 20 + Math.random() * 30 + 'px';
      span.style.animationDuration = 6 + Math.random() * 6 + 's';
      floatContainer.appendChild(span);
      setTimeout(() => span.remove(), 12000);
    }
    setInterval(createItem, 350);
  </script>
</body>
</html>
